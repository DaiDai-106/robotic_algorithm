[project]
name = "robotic-algorithm"
version = "0.1.0"
description = "主流具身模型算法代码解析 - Mainstream Embodied Model Algorithm Demos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# Flow Matching 相关依赖
fm = [
    "torch>=2.0.0",
        "matplotlib>=3.7.0",
        "tqdm>=4.65.0",
        "scikit-learn>=1.3.0",
        "pillow>=10.0.0",
]

# Reinforcement Learning 相关依赖
rl = [
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.0.0",
    "tensorboard>=2.13.0",
]

# Vision-Language-Action 相关依赖
vla = [
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "safetensors>=0.3.0",
    "pillow>=10.0.0",
]


# 开发工具
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
    "ipython>=8.14.0",
    "jupyter>=1.0.0",
]

# 全部依赖
all = [
    "robotic-algorithm[fm,rl,vla,ros,dev]",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flow_matching*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
